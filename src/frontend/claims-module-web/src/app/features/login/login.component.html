<div class="login-page">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Claims Module</mat-card-title>
      <mat-card-subtitle>Sign in with a seeded test account</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Account</mat-label>
        <mat-select [(ngModel)]="username" name="username">
          @for (account of seededAccounts; track account) {
            <mat-option [value]="account">{{ account }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </mat-card-content>

    <mat-card-actions align="end">
      @if (isLoggingIn()) {
        <mat-spinner diameter="24" />
      } @else {
        <button mat-flat-button color="primary" (click)="login()">Log in</button>
      }
    </mat-card-actions>
  </mat-card>
</div>
