name: Azure login (OIDC)
description: Logs in to Azure via OIDC using this repo's federated credential, no stored secret.

inputs:
  client-id:
    required: true
  tenant-id:
    required: true
  subscription-id:
    required: true

runs:
  using: composite
  steps:
    - uses: azure/login@v2
      with:
        client-id: ${{ inputs.client-id }}
        tenant-id: ${{ inputs.tenant-id }}
        subscription-id: ${{ inputs.subscription-id }}
